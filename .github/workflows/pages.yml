name: 發佈教學網頁到 GitHub Pages

# ════ 使用方式 ════
# 1. 首頁 index.html（單元總覽）在 repo 根目錄，手動維護卡片
# 2. 每個單元放 units/<英文代號>/（內容就是該單元的「教學網頁」資料夾）
# 3. push main 就自動發佈：根目錄＝首頁，/units/<代號>/＝各單元
# 4. 發佈時自動刪掉 server.js、questions.json（有答案！）、*.bat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出原始碼
        uses: actions/checkout@v4

      - name: 準備發佈檔案（整包，排除後端與答案檔）
        run: |
          set -e
          mkdir -p _site
          cp -r units _site/units
          cp index.html _site/index.html
          find _site -type f \( -name 'server.js' -o -name 'questions.json' \
            -o -name '*.bat' -o -name 'battle-api.js.example' \) -delete
          touch _site/.nojekyll
          echo "單元："
          ls -1 _site/units

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發佈
        id: deployment
        uses: actions/deploy-pages@v4
